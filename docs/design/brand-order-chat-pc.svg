ont-size="11" fill="#a1aabc" font-weight="400" text-anchor="start" >右侧只汇总已提交及已确认的信息。</text><text x="55" y="1111" font-size="20" fill="#172036" font-weight="750" text-anchor="start" >角色重点</text><text x="55" y="1140" font-size="13" fill="#64748b" font-weight="400" text-anchor="start" >品牌方围绕素材、风格与验收做决策；设计师围绕范围确认、制作与交付执行。</text></svg>