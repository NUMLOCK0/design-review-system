rect x="808" y="969" width="200" height="49" rx="12" fill="url(#accent)" /><text x="908" y="1000" font-size="12" fill="#fff" font-weight="700" text-anchor="middle" >确认选择方案 A</text><text x="625" y="1044" font-size="10" fill="#9aa5b7" font-weight="400" text-anchor="start" >确认结果会回填到聊天与协作档案</text><rect x="763" y="1061" width="104" height="5" rx="3" fill="#26334b" /><text x="65" y="1140" font-size="20" fill="#172036" font-weight="750" text-anchor="start" >移动端动作重点</text><text x="65" y="1170" font-size="13" fill="#64748b" font-weight="400" text-anchor="start" >品牌方：审阅视觉方案并做决策。设计师：核对范围后推进制作；所有确认都回到订单时间线。</text></svg>